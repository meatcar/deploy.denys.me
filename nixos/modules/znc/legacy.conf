Version = 1.10.1
ConnectDelay = 1
LoadModule = webadmin

<Listener old-mutable-listener>
    Port = 6697
    IPv4 = true
    IPv6 = true
    SSL = false
    AllowIRC = true
    AllowWeb = true
</Listener>

<User mutable>
    Admin = true
    Nick = mutable-nick
    AltNick = mutable-alt
    Ident = mutable-ident
    RealName = Mutable fixture
    QuitMsg = Keep my mutable settings
    LoadModule = controlpanel
    <Pass fixture>
        Method = plain
        Hash = fixture-only
    </Pass>
    <Network retained>
        Server = 192.0.2.2 6697
        LoadModule = keepnick
        <Chan #retained>
            Buffer = 37
        </Chan>
    </Network>
</User>
