version: "3"
silent: true

env:
  BAO_ROLE: project--meatcar--deploy.denys.me--prod--plan--read

includes:
  access: ./access/Taskfile.yml

tasks:
  before_nix:
    cmds: []

  setup_auth:
    cmds:
      - task: access:setup

  resume_auth:
    cmds:
      - task: access:resume

  work:
    desc: Cache main-root providers at setup without backend credentials
    cmds:
      - if [ "${SANDBOX_LIFECYCLE:-}" = setup ]; then tofu -chdir=terraform init -backend=false -input=false -lockfile=readonly; fi

  plan:
    desc: Plan the main root with orb read-only credentials
    dir: "{{.TASKFILE_DIR}}/.."
    cmds:
      - bash .agents/access/bao.sh python3 .agents/plan.py

  doctl:
    desc: Run doctl with the read-only DigitalOcean plan token
    dir: "{{.TASKFILE_DIR}}/.."
    cmds:
      - bash .agents/access/bao.sh bash .agents/doctl.sh {{.CLI_ARGS}}

  setup_cleanup:
    cmds:
      - task: access:cleanup
