[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-proxy-api-ops"
version = "0.1.0"
description = "CLIProxyAPI host and credential administration"
requires-python = ">=3.11"

[project.scripts]
cli-proxy-api-initialize = "cli_proxy_api.initialize:main"
cli-proxy-api-admin = "cli_proxy_api.admin:main"
cli-proxy-api-rotate-admin = "cli_proxy_api.rotate_admin:main"
cli-proxy-api-deploy-key = "cli_proxy_api.deploy_key:main"
cli-proxy-api-backup = "cli_proxy_api.backup:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not containers'"
markers = ["containers: requires rootless Podman and CPA_TEST_IMAGE"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
