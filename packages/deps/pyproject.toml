[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "deps"
version = "0.1.0"
description = "Report and apply the dependency updates that Renovate finds"
requires-python = ">=3.11"

[project.scripts]
deps = "deps:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["deps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
