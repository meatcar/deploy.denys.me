[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bao-sync"
version = "0.1.0"
description = "Push OpenBao KV v2 secrets to hosting providers"
requires-python = ">=3.11"

[project.scripts]
bao-sync = "bao_sync.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
